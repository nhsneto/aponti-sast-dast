name: CI Node

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pratica:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
            #fetch-depth: 0 baixa o histórico completo do Git (Por padrão, o GitHub Actions baixa apenas o último commit do repositório). Assim, o Sonarqube consegue consultar todo o histórico do projeto e gerar métricas mais precisas.
            # Ele não é um parametro do SonarQube.
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: "npm install"

  sast:
    name: execução do Sonarqube
    needs: pratica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configurando JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Sonarqube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        # conjunto de regras que diz se o código pode ou não ir para produção
#      - name: Sonarqube Quality Gate check
#        uses: SonarSource/sonarqube-quality-gate-action@master
#        env:
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Instalar dependências
        run: "npm ci"

      - name: Build
        run: "npm run build"

      - name: Executar testes
        run: "npm test"

  dast-zap-scan:
    runs-on: ubuntu-latest
    needs: [pratica, sast]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Criar Imagem Docker
        run: docker build -t node-server:1.0 ./

      - name: Iniciar Container para DAST Scan
        run: docker run -p 127.0.0.1:3000:3000 -d node-server:1.0

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          allow_issue_writing: false
          cmd_options: '-z "-config view.locale=pt_BR"'
