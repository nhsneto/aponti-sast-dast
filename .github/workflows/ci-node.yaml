name: CI Node

on:
  push:
    branches: [main, develop]

jobs:
  pratica:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: "npm install"

      - name: Build
        run: "npm run build"

      - name: Executar testes
        run: "npm test"
